<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة نورين لصابون v6.1</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:'Segoe UI',sans-serif;transition:background .3s;min-height:100vh}
    body.dark-mode{background:#0f172a;color:#f1f5f9}
    body.light-mode{background:#f8fafc;color:#0f172a}
    body.light-mode .bg-slate-900{background:#f1f5f9}
    body.light-mode .bg-slate-950{background:#e2e8f0}
    body.light-mode .border-slate-800{border-color:#cbd5e1}
    body.light-mode .text-slate-400{color:#64748b}
    .fade-in{animation:fadeIn .4s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .scale-hover{transition:transform .2s}
    .scale-hover:hover{transform:scale(1.03)}
    .scale-hover:active{transform:scale(.95)}
    .progress-bar{height:5px;border-radius:10px;background:#1e293b;overflow:hidden}
    .progress-bar .fill{height:100%;border-radius:10px;transition:width .8s;background:linear-gradient(90deg,#f59e0b,#f97316)}
    .star-rating{display:flex;gap:3px;direction:ltr}
    .star-rating .star{cursor:pointer;font-size:26px;color:#64748b;transition:all .2s}
    .star-rating .star.active{color:#f59e0b;text-shadow:0 0 12px rgba(245,158,11,.4)}
    .star-rating .star:hover{transform:scale(1.2)}
    .temp-indicator{display:inline-block;padding:3px 10px;border-radius:20px;font-weight:700;font-size:12px}
    .temp-perfect{background:rgba(34,197,94,.2);color:#22c55e;border:1px solid #22c55e}
    .temp-warm{background:rgba(251,191,36,.2);color:#f59e0b;border:1px solid #f59e0b}
    .temp-hot{background:rgba(239,68,68,.2);color:#ef4444;border:1px solid #ef4444}
    .temp-cold{background:rgba(59,130,246,.2);color:#3b82f6;border:1px solid #3b82f6}
    .tab-content-pane{max-height:75vh;overflow-y:auto;scroll-behavior:smooth}
    .tab-content-pane::-webkit-scrollbar{width:4px}
    .tab-content-pane::-webkit-scrollbar-track{background:#1e293b;border-radius:10px}
    .tab-content-pane::-webkit-scrollbar-thumb{background:#f59e0b;border-radius:10px}
    .print-only{display:none}
    .ai-card{background:linear-gradient(135deg,rgba(251,191,36,.06),rgba(251,191,36,.01));border:1px solid rgba(251,191,36,.12);border-radius:1rem;padding:.75rem}
    .ai-card:hover{border-color:rgba(251,191,36,.3)}
    .ai-thinking{animation:aiPulse 1.2s ease-in-out infinite}
    @keyframes aiPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.98)}}
    .tab-btn{padding:8px 10px!important;font-size:10px!important;min-height:34px;font-weight:700;border-radius:12px!important;flex:1;min-width:50px;transition:all .2s;text-align:center}
    .tab-btn:active{transform:scale(.95)}
    input,select,textarea{font-size:12px!important;padding:5px 8px!important;border-radius:12px!important;min-height:32px}
    input[type="number"]{-moz-appearance:textfield}
    input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    .recipe-card{cursor:pointer;transition:all .2s}
    .recipe-card:hover{transform:translateY(-2px);border-color:#f59e0b}
    
    /* ====== دليل الاستخدام ====== */
    .guide-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center;padding:1rem}
    .guide-modal.active{display:flex}
    .guide-content{background:#0f172a;border:1px solid #f59e0b;border-radius:1.5rem;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;padding:1.5rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}
    .guide-content h2{color:#f59e0b;font-size:1.3rem;font-weight:800;margin-bottom:.5rem}
    .guide-content .step{display:flex;gap:.75rem;padding:.6rem .8rem;border-radius:.75rem;margin:.4rem 0;transition:all .2s;border:1px solid rgba(251,191,36,.08)}
    .guide-content .step:hover{background:rgba(251,191,36,.05);border-color:rgba(251,191,36,.2)}
    .guide-content .step .num{background:#f59e0b;color:#0f172a;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0}
    .guide-content .step .text{flex:1;font-size:.85rem;line-height:1.5}
    .guide-content .step .text strong{color:#f59e0b}
    .guide-close{position:sticky;bottom:0;background:#0f172a;padding:.75rem 0 0;display:flex;gap:.5rem;justify-content:flex-end;border-top:1px solid rgba(251,191,36,.1)}
    .guide-close button{padding:.5rem 1.5rem;border-radius:.75rem;font-weight:700;font-size:.85rem;cursor:pointer;transition:all .2s}
    .btn-guide{border:1px solid #f59e0b;color:#f59e0b;background:transparent}
    .btn-guide:hover{background:#f59e0b;color:#0f172a}
    .btn-close-guide{background:#f59e0b;color:#0f172a;border:none}
    .btn-close-guide:hover{background:#d97706}
    .guide-content.light{background:#f8fafc;color:#0f172a}
    .guide-content.light .step{border-color:rgba(245,158,11,.1)}
    .guide-content.light .step:hover{background:rgba(245,158,11,.05)}
    .guide-content.light .guide-close{background:#f8fafc}
    
    @media(max-width:480px){.tab-content-pane{max-height:65vh}.tab-btn{font-size:8px!important;padding:5px 4px!important;min-width:38px}.guide-content{padding:1rem}}
    @media print{.no-print{display:none!important}body{background:#fff!important;color:#000!important}}
  </style>
</head>
<body class="dark-mode" id="appBody">

<div class="max-w-6xl mx-auto space-y-3 p-2 sm:p-4 app-main">

<!-- HEADER -->
<header class="flex flex-col sm:flex-row justify-between items-center border-b border-slate-800 pb-2 gap-2">
  <div class="text-center sm:text-right space-y-0.5">
    <h1 class="text-lg sm:text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-400 flex items-center gap-2">
      <span>🫧</span> حاسبة نورين لصابون <span class="text-xs text-slate-500 font-normal">v6.1</span>
    </h1>
    <p class="text-[10px] text-slate-400">PWA | 50 زيت | حاسبة pH | عطور | مكتبة وصفات</p>
  </div>
  <div class="flex items-center gap-2 no-print flex-wrap">
    <button onclick="openGuide()" class="bg-amber-600/20 hover:bg-amber-600/40 text-amber-400 text-xs rounded-xl px-3 py-2 transition border border-amber-600/30 flex items-center gap-1.5">
      <i class="fas fa-question-circle"></i> <span>كيف تعمل؟</span>
    </button>
    <button onclick="toggleTheme()" id="themeToggle" class="bg-slate-800 hover:bg-slate-700 text-white text-xs rounded-xl px-3 py-2 transition shadow"><i class="fas fa-moon"></i></button>
    <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-800 border border-slate-700 text-xs text-white rounded-xl px-3 py-2 focus:outline-none shadow">
      <option value="ar">🇸🇦 العربية</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="en">🇬🇧 English</option>
    </select>
    <button onclick="installPWA()" id="installBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs rounded-xl px-3 py-2 transition shadow hidden"><i class="fas fa-download"></i></button>
  </div>
</header>

<!-- TABS -->
<nav class="flex flex-wrap bg-slate-900/80 border border-slate-800 rounded-2xl p-1 no-print gap-0.5 backdrop-blur-sm sticky top-0 z-10">
  <button onclick="switchTab('calculator')" id="tabBtn-calculator" class="tab-btn bg-amber-600 text-white shadow">🫧 الحاسبة</button>
  <button onclick="switchTab('additives')" id="tabBtn-additives" class="tab-btn text-slate-400 hover:text-white">✨ المضافات</button>
  <button onclick="switchTab('qualities')" id="tabBtn-qualities" class="tab-btn text-slate-400 hover:text-white">📊 التحليل</button>
  <button onclick="switchTab('ph')" id="tabBtn-ph" class="tab-btn text-slate-400 hover:text-white">🧪 pH</button>
  <button onclick="switchTab('fragrance')" id="tabBtn-fragrance" class="tab-btn text-slate-400 hover;text-white">🧴 العطور</button>
  <button onclick="switchTab('library')" id="tabBtn-library" class="tab-btn text-slate-400 hover;text-white">📚 المكتبة</button>
  <button onclick="switchTab('temperature')" id="tabBtn-temperature" class="tab-btn text-slate-400 hover;text-white">🌡️ الحرارة</button>
  <button onclick="switchTab('rating')" id="tabBtn-rating" class="tab-btn text-slate-400 hover;text-white">⭐ التقييم</button>
  <button onclick="switchTab('ai')" id="tabBtn-ai" class="tab-btn text-slate-400 hover;text-white">🧠 الخبير</button>
</nav>

<!-- CALCULATOR -->
<div id="tabContent-calculator" class="space-y-3 tab-content-pane fade-in">
  <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-3 sm:p-4 shadow-md grid grid-cols-2 sm:grid-cols-4 gap-2 no-print backdrop-blur-sm">
    <div><label class="block text-[10px] font-bold text-slate-400 mb-0.5">نوع القلوي</label>
      <select id="soapTypeSelect" onchange="recalculateAll()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-amber-400">
        <option value="NaOH">🧪 NaOH</option><option value="KOH">🧪 KOH</option>
      </select>
    </div>
    <div><label class="block text-[10px] font-bold text-slate-400 mb-0.5">فائض الدهون %</label>
      <input type="number" id="superfatInput" value="5" min="0" max="20" step="0.5" oninput="recalculateAll()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white">
    </div>
    <div><label class="block text-[10px] font-bold text-slate-400 mb-0.5">طريقة السائل</label>
      <select id="waterMethodSelect" onchange="toggleWaterMethod(); recalculateAll();" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white focus:outline-none">
        <option value="ratio">نسبة %</option><option value="concentration">تركيز %</option>
      </select>
    </div>
    <div><label class="block text-[10px] font-bold text-slate-400 mb-0.5">وحدة الوزن</label>
      <select id="weightUnitSelect" onchange="onSettingsChange()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-amber-400">
        <option value="g">غرام</option><option value="oz">أونصة</option>
      </select>
    </div>
    <div id="waterRatioWrap"><label class="block text-[10px] font-bold text-slate-400 mb-0.5">نسبة السائل %</label>
      <input type="number" id="waterRatioInput" value="38" min="20" max="50" step="0.5" oninput="recalculateAll()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white">
    </div>
    <div id="lyeConcentrationWrap" class="hidden"><label class="block text-[10px] font-bold text-slate-400 mb-0.5">تركيز القلوي %</label>
      <input type="number" id="lyeConcentrationInput" value="33" min="20" max="45" step="0.5" oninput="recalculateAll()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white">
    </div>
    <div><label class="block text-[10px] font-bold text-slate-400 mb-0.5">العملة</label>
      <select id="currencySelect" onchange="onSettingsChange()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white focus:outline-none">
        <option value="د.م.">درهم</option><option value="$">$</option><option value="€">€</option><option value="دج">دينار جزائري</option>
      </select>
    </div>
    <div><label class="block text-[10px] font-bold text-slate-400 mb-0.5">سعر الصرف</label>
      <div class="flex gap-1"><input type="number" step="0.0001" id="exchangeRateInput" value="1" onchange="onSettingsChange()" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white">
      <button onclick="fetchLiveExchangeRate()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-2 rounded-xl transition">🔄</button></div>
    </div>
  </section>

  <!-- OILS TABLE -->
  <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-3 sm:p-4 shadow-md space-y-2 backdrop-blur-sm">
    <div class="flex justify-between items-center flex-wrap gap-2">
      <h3 class="font-bold text-sm text-amber-300 flex items-center gap-2"><i class="fas fa-seedling"></i> جدول الزيوت <span class="text-[10px] text-slate-500">(50)</span></h3>
      <button onclick="addOilRow()" class="no-print bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl transition shadow scale-hover">➕ إضافة</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-right text-xs">
        <thead><tr class="border-b border-slate-800 text-slate-400">
          <th class="pb-1.5">الزيت</th><th class="pb-1.5">%</th><th class="pb-1.5">الوزن</th><th class="no-print pb-1.5">السعر/كغ</th><th class="pb-1.5">التكلفة</th><th class="pb-1.5">الإجراءات</th>
        </tr></thead>
        <tbody id="oilsTableBody"></tbody>
      </table>
    </div>
    <div class="text-xs text-slate-400 flex justify-between flex-wrap gap-2">
      <span>مجموع النسب: <strong id="totalPct" class="text-white">0%</strong></span>
      <span>إجمالي الزيوت: <strong id="totalWeightDisplay" class="text-white">1000 غرام</strong></span>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-3 sm:p-4 shadow-md grid grid-cols-2 gap-2 backdrop-blur-sm">
    <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-center">
      <span class="text-slate-400 text-[10px]">💧 الماء</span>
      <div id="waterResult" class="text-base font-bold text-cyan-400">0 غرام</div>
    </div>
    <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-center">
      <span class="text-slate-400 text-[10px]">🧪 القلوي</span>
      <div id="lyeResult" class="text-base font-bold text-amber-400">0 غرام</div>
    </div>
  </section>

  <!-- SAVE -->
  <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-3 sm:p-4 shadow-md space-y-2 no-print backdrop-blur-sm">
    <div class="border-b border-slate-800 pb-1.5"><h3 class="font-bold text-sm text-emerald-400 flex items-center gap-2"><i class="fas fa-book"></i> مكتبة الوصفات</h3></div>
    <div class="flex flex-wrap gap-2">
      <input type="text" id="saveRecipeName" placeholder="اسم الوصفة" class="flex-1 min-w-[100px] bg-slate-950 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white focus:outline-none">
      <button onclick="saveCurrentRecipe()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3 py-1.5 rounded-xl transition scale-hover">💾 حفظ</button>
      <button onclick="exportBackup()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl transition scale-hover">⬇️ نسخ</button>
    </div>
    <div id="saveRecipeStatus" class="hidden text-xs"></div>
    <div id="savedRecipesList" class="space-y-1 max-h-32 overflow-y-auto"></div>
  </section>
</div>
